dbt_delta_spark_minio:
  target: dev
  outputs:
    dev:
      connect_retries: 1
      connect_timeout: 10
      threads: 1
      token: abc123
      type: spark
      method: session                     # Utiliza o método session para conectar ao Spark
      host: "spark-master"                # SPARK_MASTER_HOST
      port: 7077                          # SPARK_MASTER_PORT
      spark_home: /usr/local/spark        # Caminho para a instalação do Spark
      schema: default                     # Schema padrão
      spark_conf:
        spark.master: "spark://spark-master:7077"
        spark.local.dir: "/tmp/spark-temp"
        # Pacotes para acesso ao MINIO e Delta Lake
        spark.jars.packages: "org.apache.hadoop:hadoop-aws:3.3.4,io.delta:delta-core_2.12:2.4.0"
        spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
        spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
        
        # Configurações de recursos e otimizações
        spark.executor.instances: "4"
        spark.executor.cores: "2"
        spark.executor.memory: "1536m"
        spark.driver.memory: "1536m"
        spark.sql.shuffle.partitions: "16"
        spark.storage.memoryFraction: "0.4"
        spark.shuffle.memoryFraction: "0.5"
        spark.memory.offHeap.enabled: "true"
        spark.memory.offHeap.size: "512m"
        spark.sql.parquet.compression.codec: "gzip"
        spark.sql.orc.compression.codec: "zlib"
        spark.serializer: "org.apache.spark.serializer.KryoSerializer"
        spark.executor.extraJavaOptions: "-XX:+UseG1GC"
        spark.cleaner.referenceTracking.cleanCheckpoints: "true"
        spark.executor.cleanupOnShutdown: "true"
        
        # Configurações para acesso ao MINIO (S3 compatível)
        spark.hadoop.fs.s3a.endpoint: "http://127.0.0.1:9000"
        spark.hadoop.fs.s3a.access.key: "pkIeKAn4xpjoOgXiHQPw"
        spark.hadoop.fs.s3a.secret.key: "JZRBfRszxLZzPeaAQaEXk32JxUKv25DVjUoO06Rk"
        spark.hadoop.fs.s3a.path.style.access: "true"
        spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
  target: dev
